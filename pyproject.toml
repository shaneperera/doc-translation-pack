[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "clinical-doc-translation"
version = "0.1.0"
description = "Validated image-only clinical document translation to editable DOCX"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "lxml>=5.4,<7",
    "openai>=2.0,<3",
    "opencv-python-headless>=4.10,<5",
    "pillow>=11,<13",
    "pydantic>=2.11,<3",
    "pymupdf>=1.26,<2",
    "python-docx>=1.2,<2",
]

[project.optional-dependencies]
app = ["streamlit>=1.50,<2"]

[project.scripts]
translate-doc = "doc_translation.cli:main"
evaluate-docs = "doc_translation.eval_cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=8.4,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.13,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/doc_translation"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
